<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculador de Médias</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <span id="msg_acima_da_caixa">Calculador de médias</span>
    <div class="central">
        <input type="number" id="nota1" placeholder="Digite sua 1ª nota:" min="0" max="10" step="0.1">
        <input type="number" id="nota2" placeholder="Digite sua 2ª nota: " min="0" max="10" step="0.1">
        <input type="number" id="nota3" placeholder="Digite sua 3ª nota: " min="0" max="10" step="0.1">
        <button id="calculo"> Calcular Média</button>
        <span id="resultado"></span>
        <span id="situacao"></span>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
